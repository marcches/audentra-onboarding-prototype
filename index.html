<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Aster University — Enrollment</title>
    <meta
      name="description"
      content="Prototype of the Audentra student portal entry and onboarding experience."
    />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap"
      rel="stylesheet"
    />
    <!--
      A script face, for exactly one job: the typed signature on the enrollment
      agreement. Review & sign already asked for `font-display` there, but that
      token points at Satoshi like everything else, so a typed signature came
      out in the same sans-serif as the label above it — and no animation
      rescues that. Loaded separately because Satoshi has no script cut.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
